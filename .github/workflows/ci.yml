name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected"
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag

      - name: Install exact dependencies
        run: npm ci

      - name: Verify committed bundle matches source
        run: npm run validate:release

      - name: Build and validate
        run: npm run validate

      - name: Verify build is reproducible
        run: git diff --exit-code -- dist/

      - name: Verify cold Git and npm installs
        run: npm run pack:check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Show package contents
        run: npm pack --dry-run --json

      - name: Verify packaging did not mutate the committed bundle
        run: git diff --exit-code -- dist/
